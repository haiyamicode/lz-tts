task_name: train
run_name: lzspeech_starling_voice_clone_multilingual_f5_dit
tags:
  - lzspeech
  - starling
  - voice-clone
  - sparrow-frontend
  - vocos24k
  - f5-dit

train: true
test: false
ckpt_path: null
init_from_checkpoint: null
resume_from_output_checkpoint: true
seed: 1234

data:
  _target_: src.starling.data.text_mel_datamodule.TextMelDataModule
  name: starling_voice_clone_multilingual_24k
  train_filelist_path: ${paths.data_dir}/randomspeech_multilingual_voice_clone_24k/train.jsonl
  valid_filelist_path: ${paths.data_dir}/randomspeech_multilingual_voice_clone_24k/val.jsonl
  batch_size: 4
  num_workers: 8
  pin_memory: true
  cleaners: []
  add_blank: false
  n_spks: 23
  n_fft: 1024
  n_feats: 100
  sample_rate: 24000
  hop_length: 256
  win_length: 1024
  f_min: 0
  f_max: null
  mel_backend: vocos_mel_24khz
  data_statistics:
    mel_mean: 0.0
    mel_std: 1.0
  seed: ${seed}
  load_durations: false
  prompt_mel_enabled: true
  prompt_mel_same_speaker_prob: 1.0
  prompt_mel_same_utterance_prob: 0.0
  prompt_mel_max_frames: 512
  prompt_embedding_enabled: true
  prompt_embedding_dim: 192
  speaker_auto_id: 0
  speaker_auto_train_prob: 0.5

model:
  _target_: src.starling.models.matcha_tts.MatchaTTS
  n_vocab: 151
  n_spks: 23
  spk_emb_dim: 64
  n_feats: 100
  data_statistics: ${data.data_statistics}
  out_size: 512
  prior_loss: true
  use_precomputed_durations: ${data.load_durations}
  freeze_spk_emb: false
  speaker_condition_scale: 1.0
  prompt_condition_scale: 1.0
  prompt_mel_conditioning:
    enabled: true
  prompt_embedding_encoder:
    enabled: true
    input_dim: ${data.prompt_embedding_dim}
    hidden_dim: 256
    dropout: 0.0
    zero_init: false
  encoder:
    encoder_type: RoPE Encoder
    encoder_params:
      n_feats: ${model.n_feats}
      n_channels: 192
      filter_channels: 768
      filter_channels_dp: 256
      n_heads: 2
      n_layers: 6
      kernel_size: 3
      p_dropout: 0.1
      spk_emb_dim: 64
      n_spks: 23
      prenet: true
      semantic_dim: 768
    duration_predictor_params:
      filter_channels_dp: ${model.encoder.encoder_params.filter_channels_dp}
      kernel_size: 3
      p_dropout: ${model.encoder.encoder_params.p_dropout}
      use_sdp: true
      sdp_loss_weight: 1.0
      sdp_ratio: 0.2
      noise_scale_w: 0.8
  decoder:
    decoder_type: f5_dit
    dim: 512
    depth: 16
    heads: 8
    dim_head: 64
    dropout: 0.05
    ff_mult: 2
    qk_norm: null
    pe_attn_head: null
    attn_mask_enabled: false
    conv_pos_embed: true
    conv_pos_kernel_size: 31
    long_skip_connection: true
    checkpoint_activations: false
    prompt_mel_condition: true
    global_speaker_condition: true
    global_cond_scale: 1.0
  cfm:
    name: CFM
    solver: euler
    sigma_min: 0.0001
  optimizer:
    _target_: torch.optim.Adam
    _partial_: true
    lr: 0.00005
    weight_decay: 0.0

callbacks:
  step_checkpoint:
    _target_: src.starling.callbacks.step_checkpoint.StepCheckpointCallback
    dirpath: ${paths.output_dir}/checkpoints
    every_n_train_steps: 1000
    keep_last: 3
    retain_every_n_train_steps: 10000
    save_last: true
  model_summary: null
  rich_progress_bar:
    _target_: lightning.pytorch.callbacks.RichProgressBar
  epoch_summary:
    _target_: src.starling.callbacks.epoch_summary.EpochSummaryCallback
    precision: 4
  utmos_quality:
    _target_: src.starling.callbacks.utmos_quality.MatchaUtmosQualityCallback
    enabled: false
    every_n_epochs: 5
    train_num_samples: 5
    val_num_samples: 5
    output_dir: ${paths.output_dir}/quality/utmos_samples
    python_bin: ${paths.root_dir}/local/utmos_probe/.venv/bin/python
    worker_path: ${paths.root_dir}/local/utmos_probe/utmos_stdin_worker.py
    cuda_visible_devices: ${oc.env:STARLING_UTMOS_CUDA_VISIBLE_DEVICES,2}
    vocoder: vocos24k
    sample_rate: ${data.sample_rate}
    n_timesteps: 32
    temperature: 1.0
    length_scale: 1.0
    noise_scale_w: null
    sdp_ratio: null
    score_final_epoch: true

eval:
  enabled: false
  output_dir: ${paths.output_dir}/eval
  checkpoint: null
  device: cuda
  vocoder: vocos24k
  sample_rate: ${data.sample_rate}
  prompt_mel_max_frames: ${data.prompt_mel_max_frames}
  prompt_embedding_dim: ${data.prompt_embedding_dim}
  n_timesteps: 32
  temperature: 1.0
  length_scale: 1.0
  noise_scale_w: null
  sdp_ratio: null
  preprocess:
    piper_config: ${paths.root_dir}/data/lzspeech-starling/config.json
    semantic_model_name: distilbert/distilbert-base-multilingual-cased
    semantic_max_tokens: 256
    neural: true
  references:
    - id: clone_sample_15s
      path: ${paths.root_dir}/local/samples/clone-sample-15s.mp3
    - id: kcut
      path: ${paths.root_dir}/local/samples/kcut.mp3
    - id: andrew
      path: ${paths.root_dir}/local/samples/andrew.mp3
  dataset_samples:
    - split: train
      language: en
      count: 3
    - split: train
      language: zh
      count: 2
    - split: train
      language: ja
      count: 2
    - split: train
      language: es
      count: 2
  ood_samples:
    - id: ood_en_islam_loneliness
      language: en
      speaker: en
      text: "Many Muslims today are surrounded by people but still feel deeply alone. They may live with family, attend the masjid, work with other Muslims, join group chats, follow Islamic pages, and listen to reminders every day, yet still carry a quiet emptiness inside."
    - id: ood_en_weather_report
      language: en
      speaker: en
      text: "A cold front will move across the coast overnight, bringing scattered showers before sunrise and clearer skies by late morning."
    - id: ood_en_customer_support
      language: en
      speaker: en
      text: "Thanks for calling support. I can help you reset the device, check the account status, and confirm whether the update finished correctly."
  utmos:
    enabled: true
    python_bin: ${paths.root_dir}/local/utmos_probe/.venv/bin/python
    worker_path: ${paths.root_dir}/local/utmos_probe/utmos_stdin_worker.py
    cuda_visible_devices: ${oc.env:STARLING_EVAL_UTMOS_CUDA_VISIBLE_DEVICES,2}

logger:
  tensorboard:
    _target_: lightning.pytorch.loggers.tensorboard.TensorBoardLogger
    save_dir: ${paths.output_dir}/tensorboard/
    name: null
    log_graph: false
    default_hp_metric: true
    prefix: ""

trainer:
  _target_: lightning.pytorch.trainer.Trainer
  default_root_dir: ${paths.output_dir}
  max_epochs: 100
  accelerator: gpu
  devices:
    - 0
  precision: 32-true
  check_val_every_n_epoch: 1
  deterministic: false
  gradient_clip_val: 5.0
  accumulate_grad_batches: 4
  enable_model_summary: false

paths:
  root_dir: ${oc.env:PROJECT_ROOT}
  exp_dir: ${paths.root_dir}/local/exp/starling
  data_dir: ${paths.exp_dir}/data
  log_dir: ${paths.exp_dir}/train/${run_name}
  output_dir: ${paths.exp_dir}/train/${run_name}
  work_dir: ${hydra:runtime.cwd}

extras:
  ignore_warnings: false
  enforce_tags: false
  print_config: false

optimized_metric: null
