[project]
name = "lz-tts"
version = "0.1.0"
description = "Minimal Piper TTS inference pipeline"
readme = "README.md"
requires-python = "==3.10.12"
dependencies = [
    "numpy==1.23.5",
    "torch==2.9.1",
    "pytorch-lightning==2.6.0",
    "torchmetrics==1.8.2",
    "piper-phonemize",
    "transformers>=4.57",
    "sentencepiece>=0.2.0,<0.3",
    # piper_train dependencies for inference
    "pycld2==0.41",
    "wordfreq>=3.1.0,<3.2",
    "six>=1.17.0,<1.18",
    "librosa==0.9.1",
    "unicodedataplus>=16.0.0,<16.1",
    "regex>=2026.1,<2027",
    # CJK tokenization for multilingual_splitter
    "mecab-python3>=1.0.0,<1.1",
    # Japanese text normalization for preprocess.py
    "fugashi>=1.5.0,<1.6",
    "pykakasi>=2.3.0,<2.4",
    "mecab-ko-dic>=1.0.0,<1.1",
    "ipadic>=1.0.0,<1.1",
    "jieba>=0.42.0,<0.43",
    # API server
    "fastapi>=0.115.0,<0.116",
    "uvicorn>=0.34.0,<0.35",
    "pydub>=0.25.1",
    "boto3>=1.42.30",
    "python-dotenv>=1.2.1",
    "rapidfuzz>=3.14.3",
    "soundfile>=0.13.1",
    "huggingface-hub>=0.36.0",
    "nano-parakeet>=0.2.1",
    "torchaudio==2.9.1",
    "monotonic-align>=1.0.0",
    "pyarrow>=23.0.0",
    "tensorboard>=2.20.0",
    "peft>=0.19.1",
    "matplotlib>=3.10.9",
    "hydra-core>=1.3.2",
    "lightning>=2.6.4",
    "diffusers>=0.37.1",
    "gdown>=6.0.0",
    "wget>=3.2",
    "phonemizer>=3.3.0",
    "conformer>=0.3.2",
    "unidecode>=1.4.0",
    "g2pk>=0.9.4",
    "pyicu>=2.16.2",
    "funasr>=1.3.3",
    "modelscope>=1.37.1",
    "edge-tts>=7.2.8",
    "demucs>=4.0.1",
    "torchcodec>=0.13.0",
    "bigvgan>=2.4.1",
    "munch>=4.0.0",
    "descript-audio-codec==1.0.0",
    "h5py>=3.16.0",
    "resemblyzer>=0.1.4",
    "cn2an==0.5.22",
    "anyascii==0.3.2",
    "eng-to-ipa==0.0.2",
    "g2p-en==2.1.0",
    "g2pkk>=0.1.1",
    "jamo==0.4.1",
    "langid==1.1.6",
    "pypinyin==0.50.0",
    "txtsplit>=1.0.0",
    "unidic==1.1.0",
    "unidic-lite==1.0.8",
    "cached-path>=1.8.10",
    "gruut[de,es,fr]==2.2.3",
    "vocos>=0.1.0",
    "httpx>=0.28.1",
    "ffmpeg-normalize>=1.37.8",
    "praat-parselmouth>=0.4.2",
    "scipy==1.13.1",
    "ffmpeg-python>=0.2.0",
    "av>=17.1.0",
    "soxr>=1.1.0",
    "onnxruntime-gpu>=1.23.2",
    "zstandard>=0.25.0",
    "asgi-compression>=0.1.1",
    "semantic-text-splitter>=0.32.0",
    "datasets>=5.0.0",
    "tiktoken>=0.13.0",
    "azure-cognitiveservices-speech>=1.50.0",
    "qwen-asr>=0.0.6",
    "flash-attn>=2.8.3.post1",
    "lao2ipa>=1.0.0",
    "khmerphonemizer>=0.0.3",
    "epitran>=1.35.2",
    "km-num2text>=1.0.1",
    "ctc-forced-aligner",
    "langcodes>=3.5.1",
    "xxhash>=3.0.0",
    "triton>=3.0.0",
    "safetensors>=0.4.0",
    "pydantic>=2.0.0",
    "tqdm>=4.0.0",
    "defusedxml>=0.7.1,<0.8",
]

[build-system]
requires = ["setuptools>=80.10.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.nanovllm_voxcpm" = ["LICENSE"]

[project.scripts]
lz-tts = "src.cli:main"
lz-tts-worker = "src.taskflow_worker:run"
lz-starling-train = "src.starling.train:main"
lz-starling-eval = "src.starling.evaluate:main"

[tool.uv]
override-dependencies = ["hydra-core>=1.3.2", "omegaconf>=2.2", "transformers==4.57.6"]

[tool.uv.extra-build-dependencies]
flash-attn = ["packaging", { requirement = "torch", match-runtime = true }]

[tool.uv.extra-build-variables]
flash-attn = { MAX_JOBS = "24" }

[tool.uv.sources]
piper-phonemize = { path = "./src/phonemizer" }
flash-attn = { path = "data/runtime-wheels/flash_attn-2.8.3.post1-cp310-cp310-linux_x86_64.whl" }
epitran = { git = "https://github.com/dmort27/epitran.git", rev = "3ed96fd7d10f6f5eec75ba1deb10700fcaafe43f" }
ctc-forced-aligner = { git = "https://github.com/MahmoudAshraf97/ctc-forced-aligner.git" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["src"]
pythonpath = ["src"]
