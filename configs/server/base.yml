voxcpm:
  enabled: true
  preload: true
  model_id: voxcpm
  model_path: data/lzspeech-falcon-v1.2
  device: 0
  dtype: auto
  inference_timesteps: 16
  guidance_folded: true
  max_num_batched_tokens: 8192
  max_num_seqs: 8
  max_model_len: 4096
  gpu_memory_utilization: 0.4
  num_kvcache_blocks: 16
  enforce_eager: false
  ipa_adapter_path: null
  duration_budget:
    enabled: true
    preload: true
    use_bert: false
    checkpoint: data/lzspeech-sparrow/model.ckpt
    config_path: data/lzspeech-sparrow/config.json
    device: auto
    language: multilingual
    length_scale: 1
    token_rate: 6.25
    min_margin: 1
    max_margin: 1.35
    min_extra_tokens: 0
    max_extra_tokens: 38
    soft_text_token_limit: 64
    hard_text_token_limit: 80
    include_word_spans: false
  temperature: 1
  cfg_value: 2
  max_reference_seconds: 25
  default_locales: [ar-SA, da-DK, de-DE, el-GR, en-HK, es-ES, fi-FI, fil-PH, fr-FR, he-IL, hi-IN, id-ID, it-IT, ja-JP, km-KH,
    ko-KR, lo-LA, ms-MY, my-MM, nb-NO, nl-NL, pl-PL, pt-PT, ru-RU, sv-SE, sw-KE, th-TH, tr-TR, ur-IN, ur-PK, vi-VN, yue-CN,
    zh-CN, zh-HK]
  locale_loras:
    en-US: accent-en-US
    en-GB: accent-en-GB
  applicable_loras:
    accent-en-US: data/voxcpm-lora/accent/accent-en-US-falcon
    accent-en-GB: data/voxcpm-lora/accent/accent-en-GB-falcon
    ipa-text: data/voxcpm-lora/ipa/ipa-text-falcon
  max_concurrent_loras: 3
  max_loras_per_request: 2
  lora_composition_cache_path: cache/voxcpm-lora-compositions
  ipa_text_lora: ipa-text
seed_vc:
  preload: true
  device: cuda:0
  runtime_root: src/seed_vc_runtime
  root: data/seed-vc
  embeddings_hdf5_path: data/seed-vc/embeddings/vtts_embeddings_sparrow_fallback.h5
  tmp_dir: data/seed-vc/tmp
  output_dir: data/seed-vc/output
  voice_samples_dir: data/seed-vc/voice-samples
  fp16: true
  embedding_cache_size: 64
ssml:
  enabled: true
  voxcpm_ipa_stop_cushion_patches: 1
  voxcpm_ipa_max_length_cushion_patches: 12
  voxcpm_ipa_alignment_tolerance_patches: 2
  voxcpm_ipa_refinement_passes: 1
aligner:
  model: MahmoudAshraf/mms-300m-1130-forced-aligner
  device: cuda:0
  dtype: float16
transcribe:
  model: data/qwen3-asr-0.6b
  device: cuda:0
  dtype: float16
