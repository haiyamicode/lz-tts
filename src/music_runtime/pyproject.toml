[project]
name = "lzai-music"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=1.12.0",
    "beartype==0.14.1",
    "descript-audio-codec==1.0.0",
    "diffusers>=0.37.0",
    "diskcache>=5.6.3",
    "einops>=0.8.1",
    "fastapi>=0.110.0",
    "httpx>=0.28.1",
    "huggingface-hub>=0.36.2",
    "hydra-core==1.3.2",
    "hyper-connections>=0.4.11",
    "librosa==0.10.2",
    "loguru>=0.7.3",
    "loralib>=0.1.2",
    "matplotlib>=3.11.2",
    "ml-collections>=1.1.0",
    "munch==4.0.0",
    "numba>=0.63.1",
    "numpy==1.26.4",
    "omegaconf>=2.3.1",
    "pydub==0.25.1",
    "pytorch-wavelets>=1.3.0",
    "pywavelets>=1.9.0",
    "pyworld>=0.3.5",
    "pyyaml>=6.0.3",
    "rotary-embedding-torch==0.3.5",
    "safetensors>=0.8.0",
    "scipy>=1.10.1",
    "soundfile>=0.13.1",
    "toml>=0.10.2",
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "torchcodec>=0.9.1",
    "tqdm>=4.66.5",
    "transformers>=4.51.0,<4.58.0",
    "uvicorn[standard]>=0.27.0",
    "vector-quantize-pytorch>=1.27.15",
]

[tool.uv.sources]
# no PyPI wheel for pyworld; prebuilt so the container needs no compiler
pyworld = { path = "../../data/runtime-wheels/pyworld-0.3.5-cp311-cp311-linux_x86_64.whl" }
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
