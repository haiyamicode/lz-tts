[project]
name = "lzai-media"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=1.12.0",
    "beartype==0.14.1",
    "descript-audio-codec==1.0.0",
    "diffusers>=0.37.0",
    "diskcache>=5.6.3",
    "einops>=0.8.1",
    "fastapi>=0.110.0",
    "httpx>=0.28.1",
    "huggingface-hub>=1.31",
    "hydra-core==1.3.2",
    "hyper-connections>=0.4.11",
    "librosa==0.10.2",
    "loguru>=0.7.3",
    "loralib>=0.1.2",
    "matplotlib>=3.11.2",
    "ml-collections>=1.1.0",
    "munch==4.0.0",
    "numba>=0.63.1",
    "numpy==1.26.4",
    "omegaconf>=2.3.1",
    "pydub==0.25.1",
    "pytorch-wavelets>=1.3.0",
    "pywavelets>=1.9.0",
    "pyworld>=0.3.5",
    "pyyaml>=6.0.3",
    "rotary-embedding-torch==0.3.5",
    "safetensors>=0.7.0",
    "scipy>=1.10.1",
    "soundfile>=0.13.1",
    "toml>=0.10.2",
    "torch==2.14.1",
    "torchaudio==2.11.0",
    "torchcodec>=0.9.1",
    "tqdm>=4.66.5",
    "transformers>=5.0",
    "tiktoken==0.12.0",
    "uvicorn[standard]>=0.27.0",
    "yue2-infer==0.1.5",
    "aiohttp>=3.11.8",
    "alembic>=1.18.5",
    "av>=17.0.0",
    "blake3>=1.0.9",
    "comfy-aimdo==0.5.5",
    "comfy-angle>=0.1.1",
    "comfy-kitchen==0.2.37",
    "demucs==4.0.1",
    "faster-whisper==1.2.1",
    "kornia>=0.7.1",
    "opencv-python-headless>=4.9",
    "pillow",
    "psutil",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "pyopengl>=3.1.8",
    "python-speech-features>=0.6",
    "sentencepiece",
    "simpleeval>=1.0.0",
    "spandrel>=0.4.2",
    "sqlalchemy>=2.0.0",
    "tokenizers",
    "torchsde==0.2.6",
    "torchvision==0.29.1",
    "yarl>=1.18.0",
    "vector-quantize-pytorch>=1.27.15",
]

[tool.uv]
# yue2-infer pins numpy 2.2.6 / safetensors 0.7.0; the voice stack needs numpy 1.26
override-dependencies = ["huggingface-hub>=1.31", "torch==2.14.1", "torchaudio==2.11.0", "torchvision==0.29.1", "numpy==1.26.4", "safetensors>=0.7.0", "transformers>=5.0"]

[tool.uv.sources]
yue2-infer = { path = "../../data/runtime-wheels/yue2_infer-0.1.5-py3-none-any.whl" }
# no PyPI wheel for pyworld; prebuilt so the container needs no compiler
pyworld = { path = "../../data/runtime-wheels/pyworld-0.3.5-cp311-cp311-linux_x86_64.whl" }
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
